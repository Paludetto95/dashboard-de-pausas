    <script>
        // Mock da função parseDateTimeRobust
        function parseDateTimeRobust(dateStr) {
            if (!dateStr) return null;
            try {
                // Tenta interpretar como ISO string (formato Argus)
                if (typeof dateStr === 'string' && dateStr.includes('T')) {
                    return new Date(dateStr);
                }
                // Tenta interpretar como timestamp
                if (typeof dateStr === 'number' || !isNaN(Date.parse(dateStr))) {
                    return new Date(dateStr);
                }
                return null;
            } catch (e) {
                console.error('Erro ao parsear data:', dateStr, e);
                return null;
            }
        }

        // Mock da função normalizeDataString
        function normalizeDataString(str) {
            if (str === null || str === undefined) return '';
            return String(str).trim();
        }

        // Mock da função toTitleCase
        function toTitleCase(str) {
            if (!str) return str;
            return str.toLowerCase().replace(/\b\w/g, l => l.toUpperCase());
        }

        // Mock da função parseDurationToMinutes
        function parseDurationToMinutes(durationStr) {
            if (!durationStr) return 0;
            
            // Formato: "HH:MM:SS" ou "MM:SS" ou segundos puros
            const parts = String(durationStr).split(':');
            if (parts.length === 1) {
                // Apenas segundos
                return parseInt(parts[0], 10) / 60;
            } else if (parts.length === 2) {
                // MM:SS
                return parseInt(parts[0], 10) + (parseInt(parts[1], 10) / 60);
            } else if (parts.length === 3) {
                // HH:MM:SS
                return (parseInt(parts[0], 10) * 60) + parseInt(parts[1], 10) + (parseInt(parts[2], 10) / 60);
            }
            return 0;
        }

        // Função transformArgusData adaptada do dash.html
        function transformArgusData(apiData) {
            if (!Array.isArray(apiData)) {
                console.error("Formato de dados da API inesperado. Esperava um array.");
                return [];
            }
            console.log("TransformArgusData - Total de registros:", apiData.length);
            console.log("Primeiro registro exemplo:", apiData[0]);
            
            let validRecords = 0;
            let invalidRecords = 0;
            
            const result = apiData.map((item, index) => {
                const findField = (aliases) => aliases.find(alias => item[alias] !== undefined);

                // Campos específicos da API Argus
                const consultorField = findField(['nomeUsuario', 'usuarioNome', 'operador', 'agent_name', 'consultor', 'nome']);
                const tipoField = findField(['tipoPausaDesc', 'ocupadoDesc', 'descricao', 'pause_type', 'tipo', 'motivo']);
                const dataInicioField = findField(['dataHoraInicio', 'inicio', 'start_time', 'data_inicio']);
                const duracaoSecondsField = findField(['tempoSegundos', 'duration_seconds']);
                const duracaoStringField = findField(['duracao', 'tempo']);

                const consultor = item[consultorField] || 'Não informado';
                const tipo = item[tipoField] || 'Não informado';
                const dataInicio = item[dataInicioField];
                const grupo = item.grupoUsuarioDesc || item.grupo_desc || 'Não informado';
                
                let durationMinutes = 0;
                if (item[duracaoSecondsField] !== undefined) {
                    durationMinutes = (item[duracaoSecondsField] || 0) / 60;
                } else if (item[duracaoStringField] !== undefined) {
                    durationMinutes = parseDurationToMinutes(item[duracaoStringField] || '0');
                }

                // Debug para o primeiro registro
                if (index === 0) {
                    console.log("Transformação do primeiro registro:");
                    console.log("- Campos encontrados:", { consultorField, tipoField, dataInicioField, duracaoSecondsField, duracaoStringField });
                    console.log("- Valores originais:", { consultor: item[consultorField], tipo: item[tipoField], dataInicio: item[dataInicioField], duracaoSegundos: item[duracaoSecondsField] });
                    console.log("- Valores transformados:", { consultor, tipo, grupo, durationMinutes });
                }

                return {
                    CONSULTOR: normalizeDataString(consultor),
                    TIPO: toTitleCase(normalizeDataString(tipo)),
                    GRUPO: normalizeDataString(grupo),
                    DATA_INICIO_OBJ: parseDateTimeRobust(dataInicio),
                    DURACAO_MINUTES: durationMinutes,
                    _raw: item // Manter dados originais para referência
                };
            }).filter(item => {
                const isValid = item && item.DATA_INICIO_OBJ && item.DURACAO_MINUTES >= 0;
                if (!isValid) {
                    invalidRecords++;
                    if (invalidRecords <= 3) { // Logar apenas os primeiros 3 inválidos
                        console.log(`Registro inválido #${invalidRecords}:`, item);
                    }
                } else {
                    validRecords++;
                }
                return isValid;
            });
            
            console.log(`Transformação concluída: ${validRecords} registros válidos, ${invalidRecords} inválidos`);
            return result;
        }
